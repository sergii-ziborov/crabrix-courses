<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title description">
  <title id="title">Rust format string: each captured name gets its own value</title>
  <desc id="description">The name binding contains Ferris and flows to the name placeholder. The builds binding contains four and flows to the builds placeholder. The resulting output is Ferris ran 4 builds.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#12304b"/>
      <stop offset="1" stop-color="#07192e"/>
    </radialGradient>
    <linearGradient id="card" x2="0" y2="1">
      <stop offset="0" stop-color="#153552"/>
      <stop offset="1" stop-color="#0b233b"/>
    </linearGradient>
    <marker id="mintArrow" markerWidth="15" markerHeight="15" refX="11" refY="7.5" orient="auto">
      <path d="M 1 1 L 12 7.5 L 1 14" fill="none" stroke="#64d7b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="coralArrow" markerWidth="15" markerHeight="15" refX="11" refY="7.5" orient="auto">
      <path d="M 1 1 L 12 7.5 L 1 14" fill="none" stroke="#ff7975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1536" height="1024" rx="44" fill="url(#background)"/>
  <text x="88" y="107" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="44" font-weight="700">Printing captured values</text>
  <text x="90" y="151" fill="#a9c3d9" font-family="Arial, sans-serif" font-size="24">Each placeholder reads the binding with the same name.</text>

  <rect x="88" y="195" width="616" height="176" rx="28" fill="url(#card)" stroke="#64d7b5" stroke-width="4"/>
  <text x="120" y="247" fill="#64d7b5" font-family="Arial, sans-serif" font-size="25" font-weight="700">BINDING 1</text>
  <text x="120" y="324" fill="#f4f8ff" font-family="Menlo, Consolas, monospace" font-size="42">name = <tspan fill="#ffd16b">"Ferris"</tspan></text>

  <rect x="832" y="195" width="616" height="176" rx="28" fill="url(#card)" stroke="#64d7b5" stroke-width="4"/>
  <text x="864" y="247" fill="#64d7b5" font-family="Arial, sans-serif" font-size="25" font-weight="700">BINDING 2</text>
  <text x="864" y="324" fill="#f4f8ff" font-family="Menlo, Consolas, monospace" font-size="42">builds = <tspan fill="#ffd16b">4</tspan></text>

  <path d="M 410 374 C 410 410, 428 419, 428 449" fill="none" stroke="#64d7b5" stroke-width="6" stroke-linecap="round"/>
  <path d="M 1140 374 C 1140 412, 697 414, 697 449" fill="none" stroke="#64d7b5" stroke-width="6" stroke-linecap="round"/>
  <path d="M 415 443 L 428 463 L 441 443 Z" fill="#64d7b5"/>
  <path d="M 684 443 L 697 463 L 710 443 Z" fill="#64d7b5"/>

  <rect x="88" y="469" width="1360" height="159" rx="28" fill="#0a1d34" stroke="#ff7975" stroke-width="4"/>
  <text x="120" y="513" fill="#ff7975" font-family="Arial, sans-serif" font-size="23" font-weight="700">FORMAT STRING IN RUST</text>
  <text x="133" y="585" fill="#f4f8ff" font-family="Menlo, Consolas, monospace" font-size="38" xml:space="preserve">println!("<tspan fill="#64d7b5">{name}</tspan> ran <tspan fill="#64d7b5">{builds}</tspan> builds");</text>

  <path d="M 768 642 L 768 702" fill="none" stroke="#ff7975" stroke-width="6" stroke-linecap="round"/>
  <path d="M 753 692 L 768 719 L 783 692 Z" fill="#ff7975"/>
  <rect x="88" y="727" width="1360" height="204" rx="28" fill="url(#card)" stroke="#64d7b5" stroke-width="4"/>
  <text x="120" y="781" fill="#64d7b5" font-family="Arial, sans-serif" font-size="23" font-weight="700">FIRST LINE OF STDOUT</text>
  <text x="120" y="869" fill="#f4f8ff" font-family="Menlo, Consolas, monospace" font-size="57">Ferris ran 4 builds</text>
</svg>
