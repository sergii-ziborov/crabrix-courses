name: Verify CoursePacks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: courses-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install verifier dependency
        run: python3 -m pip install --break-system-packages --disable-pip-version-check cryptography==46.0.5
      - name: Validate content
        run: python3 tools/coursepack.py validate --courses courses/ --schema schemas/
      - name: Rebuild deterministic packs
        run: python3 tools/coursepack.py build --courses courses/ --out dist/ --deterministic
      - name: Reject stale signed assets
        run: git diff --exit-code -- dist/
      - name: Full parity and security tests
        run: python3 -m unittest discover -s tests -v
